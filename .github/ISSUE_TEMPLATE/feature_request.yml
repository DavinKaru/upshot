name: Feature request
description: Suggest an insight, chart or improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/DavinKaru/upshot/blob/main/ROADMAP.md) first, as it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the question you want answered about your money, or the problem you hit.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How might Upshot show or solve it?
  - type: textarea
    id: data
    attributes:
      label: Data it would need
      description: If you know, which parts of Up's API it would use (accounts, transactions, categories, tags…).
