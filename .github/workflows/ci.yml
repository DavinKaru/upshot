name: CI

# The quick checks every code change needs. The slow native builds live in native.yml and only run
# when something that changes the native app does.

on:
  push:
    branches: [main]
    paths-ignore: &docs
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - 'renovate.json'
  pull_request:
    paths-ignore: *docs

permissions:
  contents: read

env:
  # Upshot is privacy-first: the Expo CLI sends no usage data from CI.
  EXPO_NO_TELEMETRY: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, format, tests and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test -- --ci
      # Bundling catches broken imports and Metro errors that the type-check misses.
      - run: npx expo export --platform ios --platform android --output-dir dist
